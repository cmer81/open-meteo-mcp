version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor/patch bumps in one PR; majors stay separate so they get reviewed.
      # Upgrades of @modelcontextprotocol/sdk or zod need `npm run build && npm run smoke` (see AGENTS.md).
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must track the lowest supported Node (engines: >=22), or tsc accepts
      # APIs that crash on it. Bump by hand when the minimum Node is raised.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
