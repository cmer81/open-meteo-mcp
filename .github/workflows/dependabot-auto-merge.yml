name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs that are safe to land unreviewed.
# GitHub merges them only once every required check of the `main` ruleset
# (test (22/24/26), security) is green.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Not auto-merged:
      # - major bumps: may break the API, need a human look;
      # - @modelcontextprotocol/sdk and zod: an upgrade can publish empty tool
      #   input schemas, which only `npm run build && npm run smoke` catches
      #   (live API, not run in CI; see AGENTS.md).
      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && !contains(steps.meta.outputs.dependency-names, '@modelcontextprotocol/sdk')
          && !contains(steps.meta.outputs.dependency-names, 'zod')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
